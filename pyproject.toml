[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clikvm-m5stack"
version = "0.2.0"
description = "hey Asa multi-device gateway, M5Stack controllers, typed KVM/API planning and OQLLM adapters"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.4",
  "uvicorn==0.52.1",
  "httpx==0.28.1",
  "python-multipart==0.0.32",
  "jsonschema==4.26.0",
]

[project.optional-dependencies]
dev = []

[project.scripts]
clikvm = "clikvm.cli:main"

[tool.setuptools]
package-dir = {"" = "gateway"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["gateway"]

[tool.setuptools.package-data]
clikvm = ["static/*"]
