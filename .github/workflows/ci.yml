name: clikVM validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  software:
    name: Software and canonical contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
      - run: make setup
      - run: make test
      - name: DOM and live HTTP contract (not rendered UI or HIL)
        run: |
          npm ci --prefix tests/frontend --ignore-scripts
          PYTHONPATH=gateway .venv/bin/python tests/frontend/test_live_dom.py

  firmware:
    name: Firmware ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.4.2
    strategy:
      fail-fast: false
      matrix:
        profile: [cores3, lcd154, lcd154-touch, cores3-network, lcd154-network, lcd154-touch-network, cores3-hid, lcd154-hid, lcd154-touch-hid]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compile complete ESP32-S3 application
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          bash scripts/firmware.sh "${{ matrix.profile }}" build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-${{ matrix.profile }}
          path: |
            firmware/build-${{ matrix.profile }}/clikvm_m5stack.bin
            firmware/build-${{ matrix.profile }}/bootloader/bootloader.bin
            firmware/build-${{ matrix.profile }}/partition_table/partition-table.bin
            firmware/build-${{ matrix.profile }}/flash_args
            firmware/build-${{ matrix.profile }}/flasher_args.json
          if-no-files-found: error

  container:
    name: Gateway image starts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: |
          python -m pip install .
          clikvm init-env
          docker compose config --quiet
          docker compose up --build --wait gateway
          python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8787/health').read().decode())"
      - if: always()
        run: docker compose down

  wellman-advisory:
    name: Upstream Wellman (documented gaps)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r .governance/requirements.txt
      - name: Preserve actual nonzero conformance outcome
        id: wellman
        continue-on-error: true
        run: wellman check --root . --json > wellman-ci-report.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-wellman-report
          path: wellman-ci-report.json
          if-no-files-found: error
